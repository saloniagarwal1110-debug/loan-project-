<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loan Approval System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f5f9;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 650px;
            max-width: 100%;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .section {
            margin-bottom: 25px;
            padding: 22px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .section h2 {
            color: #007bff;
            margin-bottom: 20px;
            font-size: 21px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        /* Result Box */

        .result-box {
            margin-top: 25px;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            background: #e8f4ff;
            border: 2px solid #007bff;
        }

        .result-box h2 {
            color: #007bff;
            margin-bottom: 12px;
        }

        .result-box p {
            font-size: 22px;
            font-weight: bold;
            color: #222;
        }

        /* Responsive */

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            .container {
                padding: 20px;
            }

            .section {
                padding: 18px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Loan Approval System</h1>

        <p class="subtitle">
            Enter your details to apply for a loan
        </p>


        <!-- FORM START -->

        <form action="/predict" method="POST">


            <!-- ================= APPLICANT DETAILS ================= -->

            <div class="section">

                <h2>Applicant Details</h2>

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>
                </div>


                <div class="form-group">
                    <label for="age">Age</label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        placeholder="Enter your age"
                        min="18"
                        required>
                </div>


                <div class="form-group">
                    <label for="gender">Gender</label>

                    <select
                        id="gender"
                        name="gender"
                        required>

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter phone number"
                        required>
                </div>


                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email address"
                        required>
                </div>

            </div>


            <!-- ================= LOAN DETAILS ================= -->

            <div class="section">

                <h2>Loan Details</h2>


                <div class="form-group">

                    <label for="income">
                        Income
                    </label>

                    <input
                        type="number"
                        id="income"
                        name="income"
                        placeholder="Enter your income"
                        required>

                </div>


                <div class="form-group">

                    <label for="credit_score">
                        Credit Score
                    </label>

                    <input
                        type="number"
                        id="credit_score"
                        name="credit_score"
                        placeholder="Enter your credit score"
                        min="0"
                        max="900"
                        required>

                </div>


                <div class="form-group">

                    <label for="loan_amount">
                        Loan Amount
                    </label>

                    <input
                        type="number"
                        id="loan_amount"
                        name="loan_amount"
                        placeholder="Enter required loan amount"
                        required>

                </div>


                <div class="form-group">

                    <label for="years_employed">
                        Years Employed
                    </label>

                    <input
                        type="number"
                        id="years_employed"
                        name="years_employed"
                        placeholder="Enter years employed"
                        min="0"
                        required>

                </div>

            </div>


            <!-- ================= SUBMIT BUTTON ================= -->

            <button type="submit">
                Check Loan Approval
            </button>

        </form>


        <!-- ================= RESULT ================= -->

        {% if result %}

        <div class="result-box">

            <h2>Loan Prediction Result</h2>

            <p>
                {{ result }}
            </p>

        </div>

        {% endif %}


    </div>

</body>
</html>
